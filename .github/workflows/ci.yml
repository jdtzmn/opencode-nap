name: Build and Test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  verify:
    # ubuntu-26.04 ships uutils coreutils, whose dd alone takes about 7.6 MB
    # while the window naps, over the 5 MB nap budget the e2e test holds.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package
        run: npm pack --dry-run

      - name: Test packed package in OpenCode 2
        run: npm run test:e2e

  verify-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify package
        run: npm pack --dry-run

      - name: Test packed package in OpenCode 2
        # The 3-vCPU macOS runner times out prompts with eight jobs at once.
        env:
          NAP_E2E_JOBS: "4"
        run: npm run test:e2e

  # The wake relay on every platform it ships for, including the two the
  # verify jobs do not run on. Each build is kept as an artifact.
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test the relay
        run: bun test tests/native.test.ts

      - name: Build the relay
        id: build
        run: |
          platform=$(bun -e 'console.log(`${process.platform}-${process.arch}`)')
          sh scripts/build-native.sh "native-build/$platform"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"

      - name: Upload the relay
        uses: actions/upload-artifact@v4
        with:
          name: nap-relay-${{ steps.build.outputs.platform }}
          path: native-build/

  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test that the plugin turns itself off
        run: bun test tests/guards.test.ts
